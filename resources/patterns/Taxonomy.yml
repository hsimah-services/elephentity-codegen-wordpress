pattern: Taxonomy
description: >
  A flat vocabulary of terms, stored as WordPress taxonomy terms rather than a table
  of the framework's own. Domain edges into this vocabulary use their own columns or
  join tables, so different entities and edges cannot share native WordPress object IDs.
requires:
  driver: wordpress
config:
  taxonomy:
    type: bool
    description: Marks this entity's rows as WordPress taxonomy terms.
    default: true
fields:
  name:
    type: string
    description: >
      The term's label. A taxonomy-backed entity has exactly this field — anything
      else declared here has nowhere to live in wp_term_taxonomy and is silently
      dropped at runtime.
    required: true
    unique: true
    maxLength: 200
